name: Secretos

# Busca llaves y contraseñas en todo el historial de git, en cada PR y en cada
# push a main. No necesita secretos propios: solo lee el repo.
#
# Es una red de respaldo: corre después del push, así que no impide subir el
# secreto. Para impedirlo, activar «push protection» de secret scanning en la
# configuración del repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar con todo el historial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Se instala el binario de gitleaks, no la acción gitleaks-action: esa
      # pide una licencia para repos de organización.
      - name: Instalar gitleaks con versión fijada y suma verificada
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archivo"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archivo\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Buscar secretos en el historial
        run: gitleaks git --redact --verbose --exit-code 1 .
