name: Secretos

# Busca llaves y contraseñas en el historial de git, en cada PR y en cada push a
# main. Usa la acción oficial de gitleaks, que necesita el secret
# GITLEAKS_LICENSE porque el repo pertenece a una organización.
#
# Es una red de respaldo: corre después del push, así que no impide subir el
# secreto. Para impedirlo, activar «push protection» de secret scanning en la
# configuración del repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar con todo el historial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
